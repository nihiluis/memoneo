# Self-contained raw Compose configuration for Dokploy.
# Use versioned release images for all services.
services:
  auth:
    image: ${AUTH_IMAGE:-ghcr.io/nihiluis/memoneo-auth:v0.1.1}
    environment:
      PORT: "8089"
      DATABASE_URL: ${DATABASE_URL:?Set the external PostgreSQL DATABASE_URL in Dokploy}
      ALLOW_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN in Dokploy}
      AUTH_COOKIE_DOMAIN: ""
      AUTH_JWT_KID: ${AUTH_KID:-memoneo-auth}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-memoneo-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-memoneo}
      AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:?Set AUTH_JWT_SIGNING_KEY in Dokploy}
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/nihiluis/memoneo-api:v1.0.1}
    environment:
      NODE_ENV: production
      PORT: "8073"
      DATABASE_URL: ${DATABASE_URL:?Set the external PostgreSQL DATABASE_URL in Dokploy}
      AUTH_API_URL: http://auth:8089
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-memoneo-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-memoneo}
      ALLOW_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN in Dokploy}
    command:
      - sh
      - -ec
      - |
        pnpm db:migrate
        exec pnpm start
    depends_on:
      auth:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8073/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/nihiluis/memoneo-web:v1.0.0}
    # Tailscale Serve terminates HTTPS and forwards to this loopback port.
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

