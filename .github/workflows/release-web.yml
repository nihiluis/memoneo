name: Release Web

on:
  push:
    tags:
      - "web@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Web release tag, for example web@v1.0.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^web@v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a web@vX.Y.Z release tag" >&2
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#web@v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memoneo-web" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/auth/go.sum
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Typecheck builds the shared package required by the web tests.
      - run: pnpm typecheck && pnpm test && pnpm lint
        working-directory: frontend

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:v${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: web v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            Web container: `${{ env.IMAGE }}:v${{ env.VERSION }}`

            Serves the web app on port 80 and proxies `/api` to `api:8073`
            and `/auth` to `auth:8089`. Backend URLs default to the browser's
            current origin, so this image supports Tailscale and custom domains.
